name: CRICVERSE Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    env:
      HOME: /root
      XDG_CONFIG_HOME: /root/.config
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate cricket project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted game
          mkdir -p game
          if [[ -s cricverse/project.godot && -s cricverse/main.tscn && -s cricverse/main.gd ]]; then
            cp -a cricverse/. game/
            echo "Using native CRICVERSE project"
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: CRICVERSE project and starter archive not found"
              exit 1
            fi
            unzip -t "$ZIP_FILE"
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted
            PROJECT_FILE="$(find extracted -type f -name project.godot -print -quit)"
            if [[ -z "$PROJECT_FILE" ]]; then
              echo "ERROR: project.godot not found inside archive"
              exit 1
            fi
            cp -a "$(dirname "$PROJECT_FILE")"/. game/
          fi
          test -s game/project.godot
          echo "Project extracted successfully"
          echo "Project files:"
          find game -maxdepth 4 -type f | sort | head -n 200
          echo "Main scene setting:"
          grep -n '^run/main_scene=' game/project.godot || true
          if grep -q '^\[rendering\]' game/project.godot; then
            if ! grep -q '^textures/vram_compression/import_etc2_astc=true$' game/project.godot; then
              sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' game/project.godot
            fi
          else
            printf '\n[rendering]\ntextures/vram_compression/import_etc2_astc=true\n' >> game/project.godot
          fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/lib/android-sdk -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: Android SDK manager not found"
            find /usr/lib/android-sdk -maxdepth 4 -type f | head -n 100 || true
            exit 1
          fi
          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-33" "platforms;android-34" \
            "build-tools;33.0.2" "build-tools;34.0.0" \
            "cmdline-tools;latest" "ndk;23.2.8568313" "cmake;3.10.2.4988404"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/33.0.2"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          echo "Android SDK components verified"

      - name: Configure Java and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/keytool"
          mkdir -p /root/.config/godot
          if [ ! -f /root/debug.keystore ] || ! "$JAVA_HOME/bin/keytool" -list -keystore /root/debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            "$JAVA_HOME/bin/keytool" -genkeypair -keystore /root/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          else
            echo "Using existing Android debug keystore"
          fi
          cat > /root/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/ndk_path = "/usr/lib/android-sdk/ndk/23.2.8568313"
          export/android/cmake_path = "/usr/lib/android-sdk/cmake/3.10.2.4988404"
          export/android/debug_keystore = "/root/debug.keystore"
          EOF

      - name: Create Android export preset
        shell: bash
        run: |
          cat > game/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.cricverse.mobile"
          package/name="CRICVERSE"
          package/signed=true
          keystore/debug="/root/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          screen/immersive_mode=true
          EOF

      - name: Verify Godot and Android templates
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          TEMPLATE_DIR="/root/.local/share/godot/export_templates/4.3.stable"
          if [[ ! -d "$TEMPLATE_DIR" ]]; then
            echo "ERROR: Godot 4.3 export templates not found at $TEMPLATE_DIR"
            find /root/.local/share/godot -maxdepth 5 -type f | head -n 100 || true
            exit 1
          fi
          find "$TEMPLATE_DIR" -maxdepth 1 -type f -print

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path game --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/build
          godot --headless --verbose --path game --export-debug "Android" game/build/CRICVERSE.apk
          test -s game/build/CRICVERSE.apk
          echo "APK BUILD SUCCESSFUL"
          ls -lh game/build/CRICVERSE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CRICVERSE-APK
          path: game/build/CRICVERSE.apk
          if-no-files-found: error
